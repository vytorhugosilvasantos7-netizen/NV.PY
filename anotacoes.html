<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavyPY | Consultor Financeiro Inteligente</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="anotacoes-style.css">
</head>
<body>

    <canvas id="waveCanvas"></canvas>

    <div class="app-layout">

        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-bolt"></i>
                <h2>NV<span>PY</span></h2>
            </div>
            <div class="user-status">
                <span class="ai-badge">
                    <i class="fa-solid fa-user-tie"></i> Consultor CFO Ativo
                </span>
            </div>
        </header>

        <main class="content-container">

            <section class="chart-section">
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fa-solid fa-chart-pie"></i> Balanço Financeiro Geral</h3>
                        <span class="total-display" id="totalDisplay">Total Registrado: R$ 0,00</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="financeChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- CONSOLE DE CONSULTORIA — agora um feed de conversa real -->
            <section class="ai-chat-section">

                <div class="ai-chat-feed" id="aiChatFeed" aria-live="polite"></div>

                <div class="ai-input-container">

                    <div class="ai-input-bar">
                        <input
                            type="text"
                            id="textInput"
                            placeholder="Ex: R$ 850 insumos para empresa, R$ 120 combustível..."
                            autocomplete="off"
                            maxlength="140">

                        <button type="button" class="btn-send" id="btnSend">
                            <span>Lançar</span>
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>

                    <div class="category-selector" id="categorySelector">
                        <span class="selector-label">Destinar para:</span>
                        <button type="button" class="chip-btn active" data-category="auto" data-fullname="Auto (IA)">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Auto (IA)
                        </button>
                        <button type="button" class="chip-btn" data-category="credito" data-fullname="Cartão de Crédito">
                            <i class="fa-solid fa-credit-card"></i> Crédito
                        </button>
                        <button type="button" class="chip-btn" data-category="debito" data-fullname="Cartão de Débito">
                            <i class="fa-solid fa-wallet"></i> Débito
                        </button>
                        <button type="button" class="chip-btn" data-category="alimentacao" data-fullname="Alimentação">
                            <i class="fa-solid fa-utensils"></i> Alimentação
                        </button>
                        <button type="button" class="chip-btn" data-category="transporte" data-fullname="Transporte">
                            <i class="fa-solid fa-car"></i> Transporte
                        </button>
                        <button type="button" class="chip-btn" data-category="moradia" data-fullname="Moradia">
                            <i class="fa-solid fa-house"></i> Moradia
                        </button>
                        <button type="button" class="chip-btn" data-category="dinheiro" data-fullname="Dinheiro">
                            <i class="fa-solid fa-money-bill-wave"></i> Dinheiro
                        </button>
                        <button type="button" class="chip-btn" data-category="investimento" data-fullname="Investimentos">
                            <i class="fa-solid fa-chart-line"></i> Investimentos
                        </button>
                        <button type="button" class="chip-btn" data-category="negocios" data-fullname="Negócios">
                            <i class="fa-solid fa-briefcase"></i> Negócios
                        </button>

                        <button type="button" class="chip-btn btn-add-category" id="btnAddCategory">
                            <i class="fa-solid fa-plus"></i> Adicionar
                        </button>
                    </div>

                </div>

            </section>

            <section class="history-section">
                <div class="history-header">
                    <h3><i class="fa-solid fa-list-check"></i> Extrato de Registros</h3>
                    <div class="history-filter-wrapper">
                        <i class="fa-solid fa-filter filter-icon"></i>
                        <select id="historyFilter" class="history-filter-select">
                            <option value="all">Todas as categorias</option>
                        </select>
                    </div>
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-state">Nenhum lançamento realizado até o momento.</div>
                </div>
            </section>

        </main>
    </div>

    <div class="modal-overlay" id="categoryModal">
        <div class="modal-card">
            <h3><i class="fa-solid fa-folder-plus"></i> Criar Nova Categoria</h3>
            <p>Digite o nome do destino para suas finanças (Ex: Empresa, Carro, Faculdade, etc.):</p>
            <input type="text" id="newCategoryInput" placeholder="Ex: Empresa" maxlength="20">
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btnCancelCategory">Cancelar</button>
                <button type="button" class="btn-confirm" id="btnConfirmCategory">Criar Categoria</button>
            </div>
        </div>
    </div>

    <script src="anotacoes.js"></script>
</body>
</html>
