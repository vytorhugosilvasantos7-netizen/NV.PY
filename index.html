<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVPEY | Banco Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="login-style.css">
</head>
<body>

    <div class="bg-glow"></div>

    <main class="login-clean-container">

        <div class="security-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Criptografia SSL 256-Bit</span>
        </div>

        <header class="login-header">
            <div class="logo">
                <i class="fa-solid fa-bolt"></i>
                <h1>NV<span>PEY</span></h1>
            </div>
            <p>Sua plataforma financeira inteligente</p>
        </header>

        <!-- NAVEGAÇÃO ENTRE ABAS -->
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
            <button class="tab-btn" onclick="switchTab('register')">Criar Conta</button>
        </div>

        <!-- FORMULÁRIO 1: LOGIN -->
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="input-field">
                <label for="loginEmail">E-mail de acesso</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="loginEmail" placeholder="seuemail@dominio.com" required>
                </div>
            </div>

            <div class="input-field">
                <div class="label-row">
                    <label for="loginPassword">Senha</label>
                    <a href="#" class="forgot-pass" onclick="switchTab('forgot'); return false;">Esqueceu a senha?</a>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••••••" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Acessar Conta Segura</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- FORMULÁRIO 2: CRIAR CONTA -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="input-field">
                <label for="regName">Nome Completo</label>
                <div class="input-box">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="regName" placeholder="Seu nome completo" required>
                </div>
            </div>

            <div class="input-field">
                <label for="regEmail">E-mail de cadastro</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="regEmail" placeholder="seuemail@dominio.com" required>
                </div>
            </div>

            <div class="input-field">
                <label for="regPassword">Crie uma Senha</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Cadastrar e Entrar</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <!-- FORMULÁRIO 3: ESQUECI A SENHA -->
        <form id="forgotForm" class="auth-form" onsubmit="handleForgot(event)">
            <p class="form-desc">Digite seu e-mail cadastrado. Enviaremos um link para redefinir sua senha.</p>
            
            <div class="input-field">
                <label for="forgotEmail">E-mail de acesso</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="forgotEmail" placeholder="seuemail@dominio.com" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Enviar Link de Recuperação</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>

            <button type="button" class="btn-secondary" onclick="switchTab('login')">
                Voltar para o Login
            </button>
        </form>

        <footer class="login-footer">
            <p><i class="fa-solid fa-lock"></i> Ambiente protegido contra fraudes.</p>
        </footer>

    </main>

    <script src="mascote.js"></script>
</body>
</html>
